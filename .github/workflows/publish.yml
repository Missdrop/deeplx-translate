name: Publish extension

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Verify release commit is on main
        shell: bash
        run: |
          if ! git merge-base --is-ancestor HEAD refs/remotes/origin/main; then
            echo "Release tag must point to a commit on main."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify release version
        shell: bash
        run: |
          version=$(node -p 'require("./package.json").version')
          if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Release tag must match package.json version v$version."
            exit 1
          fi

      - name: Run tests
        run: npm test

      - name: Package extension
        run: npx --yes @vscode/vsce@4.1.1 package --allow-missing-repository --baseImagesUrl "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$GITHUB_SHA/" --out extension.vsix

      - name: Publish extension
        run: npx --yes @vscode/vsce@4.1.1 publish --oidc --packagePath extension.vsix

  release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Walk back from the tagged commit to find the previous version on main.
          previous_tag=$(git describe --tags --abbrev=0 --first-parent --match 'v[0-9]*' HEAD^ 2>/dev/null || true)
          if [[ -n "$previous_tag" ]]; then
            notes="**Full Changelog**: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/$previous_tag...${GITHUB_REF_NAME}"
          else
            notes="**Full Changelog**: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commits/$GITHUB_REF_NAME"
          fi
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes "$notes"
