name: Publish to VS Code Marketplace

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify release version
        shell: bash
        run: |
          version=$(node -p 'require("./package.json").version')
          if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Release tag must match package.json version v$version."
            exit 1
          fi

      - name: Run tests
        run: npm test

      - name: Package extension
        run: npx --yes @vscode/vsce@4.1.1 package --allow-missing-repository --out extension.vsix

      - name: Publish extension
        run: npx --yes @vscode/vsce@4.1.1 publish --oidc --packagePath extension.vsix
