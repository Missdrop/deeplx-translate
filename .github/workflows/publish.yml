name: Publish to VS Code Marketplace

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Verify release commit is on main
        shell: bash
        run: |
          if ! git merge-base --is-ancestor HEAD refs/remotes/origin/main; then
            echo "Release tag must point to a commit on main."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify release version
        shell: bash
        run: |
          version=$(node -p 'require("./package.json").version')
          if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Release tag must match package.json version v$version."
            exit 1
          fi

      - name: Run tests
        run: npm test

      - name: Package extension
        run: npx --yes @vscode/vsce@4.1.1 package --allow-missing-repository --baseImagesUrl "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$GITHUB_SHA/" --out extension.vsix

      - name: Publish extension
        run: npx --yes @vscode/vsce@4.1.1 publish --oidc --packagePath extension.vsix
